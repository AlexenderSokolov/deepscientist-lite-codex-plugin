name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The controller lock includes websockets 17, which requires Python >=3.11.
        # Python 3.10 remains a Core-only compatibility target outside this job.
        python-version: ["3.13", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked controller runtime
        shell: bash
        run: |
          python tools/validation/install_locked_dependencies.py \
            --lock plugins/deepscientist-lite-core/controller/requirements.lock
          python -c "import dbos; print('DBOS', getattr(dbos, '__version__', '2.29.0'))"
      - name: Validate on Unix
        if: runner.os != 'Windows'
        run: bash tools/validation/run_validate.sh
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/validation/run_validate.ps1
