name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate on Unix
        if: runner.os != 'Windows'
        run: bash tools/validation/run_validate.sh
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/validation/run_validate.ps1
